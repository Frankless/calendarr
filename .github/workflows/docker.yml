# Construit l'image Docker de Calendarr et la publie sur GitHub (ghcr.io/frankless/calendarr).
#
# - À chaque modification de main : image « edge » (pour tester avant une version).
# - Pour publier une version : onglet Actions → « Image Docker » → « Run workflow », puis saisir le
#   numéro (ex. 0.1.0). Le workflow publie les images « latest », « 0.1.0 » et « 0.1 », crée le tag
#   v0.1.0 et la page de version (release) avec la liste des changements.
#   Pousser soi-même un tag v0.1.0 fait la même chose.
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de la version à publier, sans le v (ex. 0.1.0). Vide = simple image edge."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then V="${INPUT#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V=""; fi
          if [ -n "$V" ] && ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Numéro de version invalide : $V (attendu : 1.2.3)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=${V:+v$V}" >> "$GITHUB_OUTPUT"
          echo "label=${V:-edge-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frankless/calendarr
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ steps.v.outputs.version == '' }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=${{ steps.v.outputs.minor }},enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.version != '' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.label }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Créer le tag et la page de version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "Calendarr $TAG" --generate-notes --target "$GITHUB_SHA" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "Calendarr $TAG" --generate-notes --target "$GITHUB_SHA"
          fi
