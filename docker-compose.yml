# Calendarr
# Sur un NAS (UGOS, Synology, QNAP…) : créez un « Projet » Docker et collez ce
# fichier tel quel. Les adresses et clés API de Radarr, Sonarr et Jellyfin se
# saisissent ensuite dans l'app : Réglages → Connexions.
services:
  calendarr:
    image: ghcr.io/frankless/calendarr:latest
    container_name: calendarr
    restart: unless-stopped
    ports:
      - "7979:7979"
    environment:
      TZ: Europe/Brussels
    volumes:
      - ./config:/config
