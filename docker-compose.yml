# Calendarr
# On a NAS (UGOS, Synology, QNAP…): create a Docker "Project" and paste this file
# as is. Radarr, Sonarr and Jellyfin addresses and API keys are then entered in
# the app: Réglages → Connexions (Settings → Connections).
services:
  calendarr:
    image: ghcr.io/frankless/calendarr:latest
    container_name: calendarr
    restart: unless-stopped
    ports:
      - "7979:7979"
    environment:
      TZ: Europe/Brussels
    volumes:
      - ./config:/config
